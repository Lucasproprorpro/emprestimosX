name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Sem versão fixa: usa a última estável, casando com os plugins recentes
          # (share_plus 12+, etc.). Se quiser reprodutibilidade, troque por sua
          # versão local exata, ex.: flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Versões (diagnóstico)
        run: flutter --version

      - name: Baixar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK release
        run: flutter build apk --release

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: emprestafacil-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
